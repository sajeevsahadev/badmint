<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: deep navy → blue-teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050d1a"/>
      <stop offset="55%"  stop-color="#07142e"/>
      <stop offset="100%" stop-color="#0a1e1a"/>
    </linearGradient>

    <!-- Cyan glow for the feather ring -->
    <radialGradient id="glowRing" cx="50%" cy="38%" r="45%">
      <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Cork gradient (white sheen) -->
    <radialGradient id="corkGrad" cx="38%" cy="32%" r="55%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0c8d8"/>
    </radialGradient>

    <!-- Feather line gradient (cyan top → white base) -->
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#b0f0ff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- ── Background rounded square ── -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind shuttlecock -->
  <ellipse cx="256" cy="195" rx="195" ry="175" fill="url(#glowRing)"/>

  <!-- ══════════════════════════════════════════
       SHUTTLECOCK (viewed from slight angle)
       Cork at bottom-center, skirt fans upward
       ══════════════════════════════════════════ -->

  <!-- ── 8 feather ribs from cork rim to top ring ── -->
  <g stroke="url(#featherGrad)" stroke-linecap="round">
    <line x1="256" y1="340" x2="148" y2="182" stroke-width="6"  opacity="0.9"/>
    <line x1="256" y1="340" x2="178" y2="155" stroke-width="5.5" opacity="0.85"/>
    <line x1="256" y1="340" x2="216" y2="143" stroke-width="5"  opacity="0.85"/>
    <line x1="256" y1="340" x2="256" y2="140" stroke-width="5"  opacity="0.9"/>
    <line x1="256" y1="340" x2="296" y2="143" stroke-width="5"  opacity="0.85"/>
    <line x1="256" y1="340" x2="334" y2="155" stroke-width="5.5" opacity="0.85"/>
    <line x1="256" y1="340" x2="364" y2="182" stroke-width="6"  opacity="0.9"/>
  </g>

  <!-- ── Feather-tip ring (top of skirt) ── -->
  <ellipse cx="256" cy="178" rx="115" ry="44"
    fill="rgba(0,229,255,0.08)"
    stroke="#00e5ff" stroke-width="7" opacity="0.95"/>

  <!-- ── Inner feather ring (mid-skirt horizontal band) ── -->
  <ellipse cx="256" cy="248" rx="80" ry="22"
    fill="none"
    stroke="#00e5ff" stroke-width="3.5" opacity="0.4"/>

  <!-- ── Cork base ── -->
  <!-- Shadow ring -->
  <ellipse cx="256" cy="375" rx="42" ry="12"
    fill="rgba(0,0,0,0.45)"/>
  <!-- Cork body -->
  <ellipse cx="256" cy="360" rx="44" ry="44"
    fill="url(#corkGrad)"/>
  <!-- Cork shine -->
  <ellipse cx="242" cy="344" rx="16" ry="12"
    fill="rgba(255,255,255,0.45)"/>
  <!-- Cork base band (connects to ribs) -->
  <ellipse cx="256" cy="354" rx="36" ry="10"
    fill="none" stroke="#b0f0ff" stroke-width="3.5" opacity="0.6"/>

  <!-- ── "B360" monogram at bottom ── -->
  <text x="256" y="468"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="76" font-weight="900" letter-spacing="6"
    fill="#00e5ff" opacity="0.9">B360</text>
</svg>
