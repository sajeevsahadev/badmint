name: Daily rebuild (prerender scheduled blogs)

# Blog posts are scheduled with a future publish_at. The static, crawlable HTML
# for a post is only generated by the post-build prerender (scripts/prerender.js),
# which runs at deploy time and includes only posts already past publish_at.
# Without a rebuild, a post that goes live is served as the JS shell (poor SEO).
# This job triggers a Vercel production redeploy once a day so each newly-live
# post gets its static page + sitemap entry the day it publishes.
#
# SETUP (one-time): in Vercel → Project → Settings → Git → Deploy Hooks, create a
# hook for the production branch, then add its URL as a GitHub Actions secret named
# VERCEL_DEPLOY_HOOK (repo → Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '15 5 * * *'   # 05:15 UTC daily — just after posts' 05:00 UTC publish time
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production redeploy
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "VERCEL_DEPLOY_HOOK secret not set — skipping. Add it to enable daily rebuilds."
            exit 0
          fi
          curl -fsSL -X POST "${VERCEL_DEPLOY_HOOK}" && echo "Redeploy triggered."
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
