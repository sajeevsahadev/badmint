<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eef4ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B360" />

    <!-- SEO -->
    <title>Badminton 360 – Club Manager, Elo Rankings & Match Tracker</title>
    <meta name="description"
      content="Free app for badminton clubs worldwide. Manage members, track matches with Elo rankings, split court costs with a shared wallet, and run tournaments — all in one place." />
    <meta name="keywords"
      content="badminton app, badminton club manager, badminton ranking, badminton Elo rating, badminton doubles ranking, badminton tournament app, badminton expense split, badminton match tracker" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://badminton360.app/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://badminton360.app/" />
    <meta property="og:title"       content="Badminton 360 – Your Club, Your Game, One App" />
    <meta property="og:description" content="Manage your badminton club, track Elo rankings, split expenses and run tournaments. Free for clubs everywhere." />
    <meta property="og:image"       content="https://badminton360.app/icon-512.png" />
    <meta property="og:locale"      content="en" />
    <meta property="og:site_name"   content="Badminton 360" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Badminton 360 – Club Rankings & Match Tracker" />
    <meta name="twitter:description" content="Free Elo ranking app for badminton clubs worldwide. Manage members, track matches, split costs, run tournaments." />
    <meta name="twitter:image"       content="https://badminton360.app/icon-512.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Badminton 360",
      "alternateName": "B360",
      "operatingSystem": "Android, iOS, Web",
      "applicationCategory": "SportsApplication",
      "description": "Free progressive web app for badminton clubs worldwide. Elo skill ratings, match tracking, expense splitting, club wallet and tournament management.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "url": "https://badminton360.app/",
      "inLanguage": "en",
      "keywords": "badminton, club, ranking, Elo, tournament, expense split, wallet",
      "publisher": { "@type": "Organization", "name": "Badminton 360" }
    }
    </script>

    <!-- Icons + PWA -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SW registration hint for PWA scanners (vite-plugin-pwa handles the full lifecycle) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' });
        });
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@300..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
