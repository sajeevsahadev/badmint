<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00e5ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Badmint" />

    <!-- SEO -->
    <title>Badmint – UAE Badminton Club Rankings & Match Tracker</title>
    <meta name="description"
      content="Free PWA for UAE badminton clubs. Track Elo rankings, attendance scores, match history and team stats across Dubai, Abu Dhabi, Sharjah and all emirates. Join or create your club." />
    <meta name="keywords"
      content="UAE badminton, badminton club Dubai, badminton ranking UAE, badminton app UAE, badminton tracker, Abu Dhabi badminton, Sharjah badminton, badminton Elo rating, badminton doubles ranking" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://badmint.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://badmint.vercel.app/" />
    <meta property="og:title"       content="Badmint – UAE Badminton Club Rankings" />
    <meta property="og:description" content="Track your badminton club's Elo rankings, match history and attendance scores. Free app for UAE courts." />
    <meta property="og:image"       content="https://badmint.vercel.app/icon-512.png" />
    <meta property="og:locale"      content="en_AE" />
    <meta property="og:site_name"   content="Badmint" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Badmint – UAE Badminton Rankings" />
    <meta name="twitter:description" content="Free Elo ranking app for UAE badminton clubs. Track skill, attendance and match history." />
    <meta name="twitter:image"       content="https://badmint.vercel.app/icon-512.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Badmint",
      "operatingSystem": "Android, iOS, Web",
      "applicationCategory": "SportsApplication",
      "description": "Free progressive web app for UAE badminton clubs. Elo skill ratings, attendance scores, match tracking and club rankings across all emirates.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AED" },
      "url": "https://badmint.vercel.app/",
      "inLanguage": "en",
      "keywords": "badminton, UAE, Dubai, Abu Dhabi, ranking, Elo, club",
      "publisher": { "@type": "Organization", "name": "Badmint" }
    }
    </script>

    <!-- Icons + PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@300..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
